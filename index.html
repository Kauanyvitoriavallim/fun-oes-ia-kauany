<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador do Oceano - Busca DuckDuckGo</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js para Objetos e Partículas 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Canvas de Fundo 3D -->
    <canvas id="bg-3d"></canvas>

    <!-- Modal Principal 3D -->
    <main class="modal-container">
        <div class="modal-card">
            
            <!-- Elemento Decorativo 3D Flutuante -->
            <div class="floating-sphere-3d"></div>

            <header class="modal-header">
                <i class="fa-solid fa-water header-icon"></i>
                <h1>Oceano & Vida Marinha</h1>
                <p>Pesquisa integrada via DuckDuckGo diretamente na sua página.</p>
            </header>

            <!-- Área de Entrada / Busca -->
            <section class="search-section">
                <div class="input-wrapper">
                    <input type="text" id="user-question" placeholder="Ex: Qual a profundidade da Fossa das Marianas?" autocomplete="off">
                    <button id="btn-ask" title="Buscar no DuckDuckGo">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </section>

            <!-- Sugestões Rápidas de Busca -->
            <section class="suggestions">
                <span>Sugestões de busca:</span>
                <div class="tags">
                    <button class="tag" data-q="Baleia-azul">Baleia-Azul</button>
                    <button class="tag" data-q="Recife de coral">Recifes de Coral</button>
                    <button class="tag" data-q="Tubarão-branco">Tubarão-Branco</button>
                    <button class="tag" data-q="Fossa das Marianas">Fossa das Marianas</button>
                </div>
            </section>

            <!-- Modal / Card de Resposta -->
            <section id="response-box" class="response-box hidden">
                <div class="response-header">
                    <span class="badge" id="source-badge"><i class="fa-solid fa-compass"></i> DuckDuckGo Search</span>
                    <button id="btn-tts" class="tts-btn" title="Ouvir Resposta por Voz">
                        <i class="fa-solid fa-volume-high"></i> <span id="tts-label">Ouvir Voz I.A</span>
                    </button>
                </div>

                <div class="response-content">
                    <p id="answer-text">A buscar na internet...</p>
                </div>

                <div class="response-footer">
                    <a id="news-link" href="#" target="_blank" rel="noopener noreferrer" class="news-button hidden">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> Ver Notícia / Fonte Completa
                    </a>
                </div>
            </section>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
